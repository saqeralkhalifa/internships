<script>
/* MCLANG: one language resolver shared across Dr. Saqer AlKhalifa's student tools. */
function mcInitLang(){
  try{
    var q = (location.search.match(/[?&]lang=(ar|en)\b/) || [])[1];
    if(q) return q;
    var s = window.localStorage && localStorage.getItem("mc-lang");
    if(s === "ar" || s === "en") return s;
    var n = (navigator.languages && navigator.languages[0]) || navigator.language || "";
    if(/^ar/i.test(n)) return "ar";
  }catch(e){}
  return "en";
}
function mcSaveLang(v){ try{ localStorage.setItem("mc-lang", v); }catch(e){} }
</script>

/* ============================================================
   Major Compass shared theme, option 2A
   Ink and paper editorial, Newsreader display, brass accent.
   Tokens mirror theme.css from the design handoff.
   Square corners everywhere except the language pill.
   No shadows, no gradients, no icons.
   ============================================================ */
:root{
  --font-display:'EB Garamond', Georgia, 'Times New Roman', serif;
  --font-body:'EB Garamond', Georgia, 'Times New Roman', serif;
  --font-ar:'Noto Naskh Arabic', 'Amiri', Georgia, serif;

  --paper:#FAF5EA;
  --paper-2:#EFE4CE;
  --card:#F5ECDA;
  --line:#E2D5BB;
  --line-2:#D3C0A0;

  --ink:#152A55;
  --ink-2:#4A3728;
  --ink-3:#6B5B47;

  --navy:#152A55;
  --navy-deep:#0F2047;
  --accent:#7D5F27;
  --accent-soft:#EFE4CE;
  --accent-line:#D3C0A0;

  --gold:#7D5F27;
  --gold-soft:#F5ECDA;
  --gold-line:#E2D5BB;
  --gold-bright:#C09A45;

  --good:#2F5D46;  --good-soft:#E7EEE8;  --good-line:#C9D8CC;
  --warn:#7D5F27;  --warn-soft:#F5ECDA;  --warn-line:#E2D5BB;
  --bad:#8C3A30;   --bad-soft:#F6EAE3;   --bad-line:#E4D2C7;

  --radius:2px; --radius-sm:2px;
  --shadow:none; --shadow-lift:none;
}

body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  font-size:16px;
  line-height:1.8;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
[dir="rtl"] body{font-family:var(--font-ar); line-height:1.95;}
body::before{display:none !important;}

/* ---------- display type: Newsreader 400, never bold serif ---------- */
.serif, .chap h2, .cn, .stat-n, .minrow b, .grp-t, .grp h2, .panel h2,
.srcbox h2, .majors-title, .hero h1, h1, h2, h3{
  font-family:var(--font-display);
  font-weight:400;
  font-variation-settings:normal;
  letter-spacing:-.02em;
}
[dir="rtl"] .serif, [dir="rtl"] .chap h2, [dir="rtl"] .cn, [dir="rtl"] .stat-n,
[dir="rtl"] .minrow b, [dir="rtl"] .grp-t, [dir="rtl"] .grp h2, [dir="rtl"] .panel h2,
[dir="rtl"] .srcbox h2, [dir="rtl"] .majors-title, [dir="rtl"] .hero h1,
[dir="rtl"] h1, [dir="rtl"] h2, [dir="rtl"] h3{
  font-family:var(--font-ar); letter-spacing:0; font-weight:600; line-height:1.35;
}
.stat-n, .minrow b, .cnt, td, th, .cal-row b{font-variant-numeric:tabular-nums;}
::selection{background:var(--paper-2); color:var(--ink);}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
a:focus-visible, button:focus-visible, input:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px; border-radius:0;
}

/* ---------- the shared dark nav ---------- */
.mc-nav{
  background:var(--ink); color:var(--paper);
  position:sticky; top:0; z-index:40;
}
.mc-nav-inner{
  max-width:920px; margin:0 auto; padding:13px 22px;
  display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap;
}
.mc-brand{display:flex; align-items:baseline; gap:10px; text-decoration:none; color:var(--paper); min-width:0;}
.mc-brand b{font-family:var(--font-display); font-size:17px; font-weight:400; letter-spacing:-.01em; white-space:nowrap;}
[dir="rtl"] .mc-brand b{font-family:var(--font-ar); font-weight:600; letter-spacing:0;}
.mc-brand span{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#9AAAD0; white-space:nowrap;}
[dir="rtl"] .mc-brand span{letter-spacing:0; text-transform:none; font-size:12px;}
.mc-nav-links{
  display:flex; gap:20px; font-size:12px; letter-spacing:.06em; align-items:center;
  overflow-x:auto; scrollbar-width:none; flex:1 1 auto; justify-content:center;
}
.mc-nav-links::-webkit-scrollbar{display:none;}
[dir="rtl"] .mc-nav-links{letter-spacing:0; font-size:13px;}
.mc-nav-links a{
  color:#D3DCEF; text-decoration:none; white-space:nowrap; padding-bottom:2px;
  border-bottom:1px solid transparent; transition:color .15s, border-color .15s;
}
.mc-nav-links a:hover{color:var(--paper);}
.mc-nav-links a[aria-current="page"]{color:var(--paper); border-bottom-color:var(--accent);}
.mc-nav .lang-toggle{
  flex:0 0 auto; border:1px solid var(--accent); background:var(--accent); border-radius:999px;
  padding:6px 17px; font-size:13px; letter-spacing:.04em; font-weight:600;
  color:#F5ECDA; cursor:pointer; font-family:var(--font-body);
  transition:background .15s, color .15s, border-color .15s;
}
.mc-nav .lang-toggle:hover{background:var(--paper); color:var(--ink); border-color:var(--paper);}
@media (max-width:640px){
  .mc-nav-inner{padding:11px 18px; gap:10px;}
  .mc-nav-links{justify-content:flex-start; order:3; width:100%; gap:16px; padding-bottom:2px;}
}
@media print{ .mc-nav{display:none;} }

/* the old in-page masthead and pill switcher are replaced by .mc-nav */
header.site, nav.toolnav{display:none !important;}

/* ---------- page header ---------- */
.hero, .res-head{position:relative;}
.hero::before{display:none !important;}
.hero{padding-top:52px;}
.hero h1{font-size:clamp(34px, 5.4vw, 52px); line-height:1.04; font-weight:400;}
[dir="rtl"] .hero h1{line-height:1.35; font-weight:600;}
.hero p, .hero p.sub{color:var(--ink-2);}
.kicker, .eyebrow{
  color:var(--accent); font-weight:600; font-size:11px;
  letter-spacing:.18em; text-transform:uppercase;
}
[dir="rtl"] .kicker, [dir="rtl"] .eyebrow{letter-spacing:0; text-transform:none; font-size:13px;}

/* ---------- surfaces: square, flat, ruled ---------- */
.panel, .mcard, .pcard, .qcard, .viz-root, .srcbox, .toc, .lede, .stat, .nextbox,
.m, .fact, .pt, .bar, .quizbar, .cta-inline, .rule, .checked, .hedge, .extra, .flag,
.note, .card, .grp{
  border-radius:0 !important;
  box-shadow:none !important;
}
.panel, .mcard, .pcard, .qcard, .viz-root, .srcbox, .toc, .stat, .nextbox, .m, .fact{
  background:var(--card); border:1px solid var(--line-2);
}
.mcard:hover, .pcard:hover, .m:hover{border-color:var(--ink-3);}
.pcard{border-inline-start-width:2px; border-inline-start-color:var(--accent);}
.lede{background:var(--card); border:1px solid var(--line-2);
  border-inline-start:2px solid var(--accent) !important; border-inline-end:1px solid var(--line-2) !important;}

/* ---------- buttons ---------- */
.btn{
  background:var(--ink); border:1px solid var(--ink); border-radius:0;
  font-weight:500; letter-spacing:0; color:var(--paper); box-shadow:none;
  transition:background .15s, border-color .15s, color .15s;
}
.btn:hover{background:var(--accent); border-color:var(--accent); color:#fff; transform:none; filter:none; box-shadow:none;}
.btn.ghost, .btn.secondary{
  background:transparent; color:var(--ink); border:1px solid var(--ink); box-shadow:none;
}
.btn.ghost:hover, .btn.secondary:hover{background:var(--ink); border-color:var(--ink); color:var(--paper);}
.printbtn{border:1px solid var(--line-2); border-radius:0; background:transparent; color:var(--ink-2);}
.printbtn:hover{background:var(--ink); border-color:var(--ink); color:var(--paper);}

/* filter chips and pickers: square, ruled */
.fbtn, .chip, .navbtn, .picker button, .filters button{
  border:1px solid var(--line-2); border-radius:0; background:transparent; color:var(--ink-2);
  box-shadow:none; transition:background .15s, color .15s, border-color .15s;
}
.fbtn:hover, .chip:hover, .navbtn:hover{border-color:var(--ink); color:var(--ink); background:transparent; transform:none;}
.fbtn.on, .chip.on, .navbtn.on{
  background:var(--ink); border-color:var(--ink); color:var(--paper); font-weight:500; box-shadow:none;
}
input[type="text"], input[type="search"], select, textarea, .srch{
  border-radius:0 !important; border:1px solid var(--line-2); background:var(--card);
  font-family:var(--font-body); color:var(--ink);
}
[dir="rtl"] input, [dir="rtl"] select, [dir="rtl"] textarea{font-family:var(--font-ar);}

/* ---------- bars and callouts: flat bands, no gradients ---------- */
.bar, .quizbar, .cta-inline{
  background:var(--paper-2); border:1px solid var(--line); border-radius:0;
}
.rule, .checked, .hedge, .extra, .flag{border-radius:0;}
.rule.w, .checked, .hedge, .extra, .flag{background:var(--warn-soft); border-color:var(--warn-line);}
.rule.b{background:var(--bad-soft); border-color:var(--bad-line);}
.rule.n{background:var(--paper-2); border-color:var(--line);}
.row.act{background:var(--paper-2) !important; border-color:var(--line) !important;}

/* ---------- band chips and verdict pills keep meaning, lose gloss ---------- */
.band{border-radius:0; font-weight:600;}

/* ---------- section labels ---------- */
.sec h3, .lbl, .toc h2, .row h4{
  letter-spacing:.14em; font-weight:600; text-transform:uppercase; font-size:11px; color:var(--ink-3);
}
[dir="rtl"] .sec h3, [dir="rtl"] .lbl, [dir="rtl"] .toc h2, [dir="rtl"] .row h4{
  letter-spacing:0; text-transform:none; font-size:13px;
}

/* ---------- tables ---------- */
table{border-collapse:collapse;}
th{
  text-align:start; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-3); font-weight:600; padding:12px 14px; border-bottom:1px solid var(--ink);
}
[dir="rtl"] th{letter-spacing:0; text-transform:none; font-size:13px;}
td{padding:14px; border-bottom:1px solid var(--line); color:var(--ink-2); vertical-align:top; font-size:14px;}

/* ---------- footer ---------- */
footer.site{
  margin-top:56px; padding:26px 0 0; border-top:1px solid var(--line); color:var(--ink-3); font-size:13px;
}
footer.site a{color:var(--accent); font-weight:500;}


/* ---- 2A refinements ---- */
input, button, select, textarea{border-radius:0;}
.lang-toggle, .mc-nav .lang-toggle{border-radius:999px;}
.pt{border-inline-start-width:2px !important;}
.compass, .emoji{display:none !important;}
.opt{border-radius:0 !important;}
.opt.selected{background:var(--paper-2); border-color:var(--ink);}
.band{border-radius:0 !important;}
hr{border:0; border-top:1px solid var(--line);}

/* ---- 2A: square the remaining pills, protect quiz progress ---- */
.section-chip, .progress-bar, .progress-fill, .bar-fill, .chip, .meta-chips .chip,
.tag, .pill, .badge, .cta, .startbtn{border-radius:0 !important;}
.section-chip{background:var(--paper-2); color:var(--accent); border:1px solid var(--line);
  font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; padding:5px 12px;}
[dir="rtl"] .section-chip{letter-spacing:0; text-transform:none; font-size:13px;}
body:has(#screen-quiz.active) .mc-nav-links{display:none;}

/* ---- 2A: square corners everywhere except the language pill ---- */
.wrap, .wrap *, .mc-nav *:not(.lang-toggle){border-radius:0 !important;}
.lang-toggle{border-radius:999px !important;}
.subj, .tag, .chip{
  background:transparent !important; border:1px solid var(--line-2) !important;
  color:var(--ink-2) !important; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  padding:4px 9px !important; font-weight:500;
}
[dir="rtl"] .subj, [dir="rtl"] .tag, [dir="rtl"] .chip{letter-spacing:0; text-transform:none; font-size:13px;}
.mrank{
  background:transparent !important; border:0 !important; width:auto !important; height:auto !important;
  font-family:var(--font-display); font-size:22px; font-weight:400; color:var(--accent) !important;
  box-shadow:none !important; min-width:28px;
}
[dir="rtl"] .mrank{font-family:var(--font-ar); font-weight:600;}
html{scroll-padding-top:76px;}
.wrap [id], .m, .mcard{scroll-margin-top:76px;}

@media (max-width:520px){
  .hero h1{font-size:clamp(28px, 8vw, 36px);}
}

/* ---- nav: links back to the main site and the book ---- */
.mc-nav-inner{max-width:1160px !important; gap:14px; flex-wrap:nowrap;}
.mc-nav-links{gap:17px; justify-content:center; min-width:0;}
@media (max-width:1100px){ .mc-brand span{display:none;} }
@media (max-width:760px){
  .mc-nav-inner{flex-wrap:wrap;}
  .mc-nav-links{order:3; width:100%; justify-content:flex-start;}
}

/* What internships actually do. Evidence, checked 12 August 2026.

const EVIDENCE = [
{id:"callback", strength:"causal",
 claim:{en:"Listing internship experience on a CV raised the interview callback rate by about 14 per cent.",
        ar:"ذكر خبرة التدريب في السيرة الذاتية رفع نسبة الاستدعاء للمقابلة بنحو ١٤ بالمئة."},

         ar:"نانلي وبيو وروميرو وسيلز، مجلة اقتصاديات العمل، المجلد ٣٨، ٢٠١٦. تجربة عشوائية أُرسلت فيها سير ذاتية وهمية إلى وظائف حقيقية."},
 url:"https://ideas.repec.org/a/eee/labeco/v38y2016icp37-46.html",

       ar:"التصميم عشوائي، فهذا أثر سببي حقيقي على الحصول على مقابلة لا على الحصول على الوظيفة. ويخلص الباحثون إلى أن الآلية هي الإشارة: التدريب يخبر صاحب العمل شيئًا عنك أكثر مما يكسبك مهارة يحتاجها. والدراسة أمريكية وتقتصر على وظائف الأعمال."}},

{id:"earnings", strength:"causal",

 url:"https://jhr.uwpress.org/content/57/4/1242",

{id:"rationed", strength:"survey",
 claim:{en:"Internships are rationed, not freely available. Only 41 per cent of final year and 22 per cent of third year students had done one in the previous twelve months, and 63 per cent of those who had not said they had wanted to.",

 source:{en:"National Survey of College Internships 2023, Center for Research on College Workforce Transitions, University of Wisconsin Madison, with Strada Education Foundation. 2,824 students.",
         ar:"المسح الوطني للتدريب الجامعي ٢٠٢٣، مركز أبحاث الانتقال من الجامعة إلى سوق العمل بجامعة ويسكونسن ماديسون، بالتعاون مع مؤسسة سترادا. شمل ٢٨٢٤ طالبًا."},
 url:"https://cdn.prod.website-files.com/6777c52f82e5471a3732ea25/679a75cb40cfdba551afc484_Building-Better-Internships-NSCI-Descriptive-Report-June-2024.pdf",
 note:{en:"This one governs how you read every other number here. If most people who do internships are the ones who could get one, then part of the offer and salary advantage belongs to them, not to the internship. The reasons students gave for not doing one were a heavy course load at 58 per cent, not being selected at 38 per cent, no opportunities in their field at 33 per cent, an existing job at 33 per cent and insufficient pay at 25 per cent.",

{id:"paid", strength:"contested",
 claim:{en:"Among graduates who interned at private firms, 72 per cent of paid interns received a job offer against 44 per cent of unpaid interns, and 37 per cent of students with no internship at all.",

 url:"https://www.naceweb.org/job-market/internships/paid-interns-co-ops-see-greater-offer-rates-and-salary-offers-than-their-unpaid-classmates/",
 note:{en:"The direction of this gap is not disputed but its size is. The comparison cannot separate the effect of the placement from who takes it. Smith, Journal of Student Financial Aid 2023, shows low income students were about 1.6 times more likely to end up unpaid. Unpaid placements also cluster in sectors that pay less anyway, such as media, non profit and government. The data is from 2015 and has not been refreshed. Read it as a reason to ask about pay, not as a measured return.",
       ar:"اتجاه هذه الفجوة غير متنازع عليه، أما حجمها فمتنازع عليه. فالمقارنة لا تفصل أثر التدريب عن خصائص من يلتحق به. وتُظهر دراسة سميث في مجلة المساعدات المالية الطلابية ٢٠٢٣ أن الطلبة من الأسر منخفضة الدخل أكثر عرضة بنحو ١٫٦ مرة للالتحاق بتدريب بلا أجر. كما يتركز التدريب غير المدفوع في قطاعات رواتبها أدنى أصلًا كالإعلام والعمل الخيري والقطاع الحكومي. والبيانات من ٢٠١٥ ولم تُحدَّث. فاقرأها كسبب لتسأل عن الأجر، لا كعائد مقيس."}},

{id:"employers", strength:"survey",

/* What a placement in each sector is actually good for. */
const SECTOR_READ = {
finance:{
 good:{en:"Good for learning how a regulated institution documents a decision, and for putting a name on your CV that every other employer in the region recognises. It is also the fastest way to find out whether you can sit with numbers for eight hours without losing accuracy.",
       ar:"مفيد لتتعلم كيف توثّق مؤسسة خاضعة للرقابة قراراتها، ولتضع في سيرتك اسمًا يعرفه كل صاحب عمل آخر في المنطقة. وهو أسرع طريقة لتعرف هل تستطيع الجلوس مع الأرقام ثماني ساعات دون أن تفقد الدقة."},
 expect:{en:"Expect Excel, reconciliations, know your customer and compliance checks, credit files, and sitting silently in meetings. You will rarely see a client and almost never see a decision made, only the paperwork that follows it.",

 expect:{en:"Expect a long safety induction, a rotation across an office and a site, shadowing engineers, logging data and health and safety paperwork. Access to live plant is usually restricted for students, so much of the value comes from the people you sit with rather than the tasks you are given.",

 leads:{en:"It leads to the graduate and cooperative training programmes of the national oil companies, which remain the main structured entry route for nationals, and to downstream petrochemicals. Service contractors and engineering consultancies hire faster but pay and stability differ sharply.",

industry:{
 good:{en:"Good for understanding how physical goods, cost and time actually behave, knowledge that stays useful even if you leave the sector. It is one of the few placements where you can see the whole chain from ship to gate in a single week.",

 expect:{en:"Expect time in a yard or warehouse, shift patterns, terminal operating systems, customs and shipping documentation, and heat. The work is physical and administrative at once, and much of the workforce around you will not be speaking Arabic or English as a first language.",

tech:{

consulting:{

gov:{

 leads:{en:"It leads to graduate entry at ministries and authorities, to a secondment into a programme office, and to credibility when you later apply to any firm that sells to government. Understand before you go that public sector pay in most Gulf states runs on published grade and qualification rules, so the placement affects whether you get in, not what you are paid.",
        ar:"يقود إلى التعيين المباشر للخريجين في الوزارات والهيئات، وإلى الانتداب إلى مكتب برنامج، وإلى مصداقية عند التقديم لاحقًا على أي شركة تبيع للحكومة. واعلم قبل أن تبدأ أن أجور القطاع العام في معظم دول الخليج محكومة بسلالم درجات ومؤهلات منشورة، فالتدريب يؤثر في دخولك لا في راتبك."}},
health:{

education:{
 good:{en:"Good because it tests whether you can hold a room of thirty people who did not choose to be there, and nothing else in university tests that. It is the cheapest way to find out that teaching is not for you before you take a four year qualification.",

 expect:{en:"Expect classroom observation, marking, small group support, preparing resources and administrative work. You will rarely lead a full lesson, and in many Gulf schools a student placement is treated as a supervision task rather than as training.",

hospitality:{
 good:{en:"Good for a fast and honest read on service standards, operational discipline and how a business runs on a margin. It is also the sector where an unpaid or very low paid placement is most common and most likely to be plain labour, so read the terms before you agree.",

legal:{

 expect:{en:"Expect document review, translation between Arabic and English, preparing bundles, research memoranda, and at a local firm some court filing work. International firms in the financial centres do mostly transactional work and typically give students less to touch.",

ngo:{
 good:{en:"Good for early responsibility, because these organisations are short staffed and will hand you real work quickly. You will build things yourself rather than watch, which is rare at this stage.",

 expect:{en:"Expect events, donor and grant reporting, social media, and spreadsheets you will have to build from nothing because no one else has. Supervision is often thin and processes are often absent, which is a burden and an opportunity at the same time.",

 leads:{en:"The Gulf sector is small and funded mainly by government, royal foundations and corporate giving. A placement here more often leads to a communications, programme management or corporate social responsibility role inside a company or a government entity than to a career in the sector itself.",

aviation:{
 good:{en:"Good because this is one of the few industries where Gulf employers are genuinely global operators, so what you learn transfers outside the region. It also shows you an operation that runs to the minute, which changes how you think about scheduling and cost.",

 expect:{en:"Expect rostered operations work, ground handling or hub control observation, network and schedule planning support, and a large amount of safety and compliance documentation. Airside access requires its own security clearance and training, which can take up a good part of a short placement.",
         ar:"توقّع عملًا تشغيليًا بالورديات، ومشاهدة الخدمات الأرضية أو غرفة التحكم، ودعم تخطيط الشبكة والجداول، وكمًّا كبيرًا من وثائق السلامة والالتزام. والدخول إلى المنطقة الجوية يتطلب تصريحًا أمنيًا وتدريبًا خاصًا، وقد يستهلك جزءًا كبيرًا من تدريب قصير."},
 leads:{en:"It leads to airline graduate programmes, to airport operators and regulators, and to maintenance and repair organisations. Be clear that pilot and cabin crew careers are recruited through separate academies and cadet schemes and are not entered through an internship.",
        ar:"يقود إلى برامج الخريجين في شركات الطيران، وإلى مشغّلي المطارات والجهات التنظيمية، وإلى شركات الصيانة والإصلاح. وليكن واضحًا أن مسار الطيارين وأطقم الضيافة يُوظَّف عبر أكاديميات وبرامج منفصلة ولا يُدخل إليه عن طريق التدريب."}}

/* The body we prefill. The student replaces the bracketed parts. */
function applyBody(o, lang, extra){
  const org  = o.org[lang];
  const prog = o.prog[lang];
  if(lang === "ar"){
    /* Kept deliberately short. Arabic percent-encodes to about nine characters
       per letter, and several mail handlers cut a mailto link off past 2000. */
    return [
      "تحية طيبة،",
      "",
      "أتقدم بطلب للالتحاق بـ" + prog + " لدى " + org + ".",
      "",
      "الاسم: [كما في البطاقة]",
      "الجهة الدراسية: []",
      "التخصص والسنة: [مثال: محاسبة، الثالثة]",
      "الرقم الشخصي: []",
      "الهاتف: []",
      "الفترة المتاحة: [من / إلى]",
      "",
      "سبب اختياري لكم: [ثلاثة أسطر عن الجهة]",
      "",
      (extra ? "المرفقات: " + extra : "المرفق: السيرة الذاتية."),
      "",
      "وشكرًا،",
      "[اسمك]"
    ].join("\n");
  }
  return [
    "Dear Sir or Madam,",
    "",
    "I am writing to apply for the " + prog + " at " + org + ".",
    "",
    "Name: [your full name as it appears on your CPR]",
    "University or school: [your institution]",
    "Subject and year: [for example, Accounting, third year]",
    "CPR number: [your CPR]",
    "Phone: [your number]",
    "Dates I am available: [for example, 1 July to 31 August]",
    "",
    "Why I want to train with you specifically: [three lines about why this organisation, not about yourself]",
    "",
    (extra ? "Attached: " + extra : "Attached: my CV."),
    "",
    "Thank you for your time,",
    "[your name]"
  ].join("\n");
}

var LANG="en", CT="bh", ST="all", LV="all", SE="all", GRP="";
function L(){ return T[LANG]; }
function tx(o){ return o ? o[LANG] : ""; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function grpSectors(){ return GRP && GROUP_SECTORS[GRP] ? GROUP_SECTORS[GRP] : null; }

function matches(o){
  if(o.ct !== CT) return false;
  if(ST !== "all" && o.status !== ST) return false;
  if(LV !== "all" && o.level.indexOf(LV) < 0) return false;
  if(SE !== "all" && o.sector !== SE) return false;
  var g = grpSectors();
  if(g && g.indexOf(o.sector) < 0) return false;
  return true;
}

function chips(el, items, sel, attr){
  document.getElementById(el).innerHTML = items.map(function(i){
    var soon = (i.live === false);
    return '<button class="chip'+(i.k===sel?" on":"")+(soon?" soon":"")+'"'+
      (soon?' disabled title="'+esc(L().soon)+'"':'')+
      ' data-'+attr+'="'+i.k+'">'+ (i[LANG] || i.en) +'</button>';
  }).join("");
}

function renderMatcher(){
  var t = L();
  document.getElementById("m-h").textContent = t.mH;
  document.getElementById("m-p").innerHTML = t.mP.replace(
    LANG==="en" ? "the quiz is thirty four questions" : "فهو أربعة وثلاثون سؤالًا",
    '<a href="'+MC+'" target="_blank" rel="noopener">'+(LANG==="en"?"the quiz is thirty four questions":"فهو أربعة وثلاثون سؤالًا")+'</a>');
  var items = GROUP_LABELS.slice();
  document.getElementById("mchips").innerHTML =
    items.map(function(g){
      return '<button class="chip'+(g.k===GRP?" on":"")+'" data-grp="'+g.k+'">'+g[LANG]+'</button>';
    }).join("") +
    (GRP ? '<button class="chip" data-grp="">'+t.mClear+'</button>' : "");
  document.getElementById("m-hint").textContent = t.mHint;
}

function renderSectorRead(){
  var t = L(), el = document.getElementById("sread"), k = null;
  if(SE !== "all") k = SE;
  else if(GRP && GROUP_SECTORS[GRP]) k = GROUP_SECTORS[GRP][0];
  if(!k || !SECTOR_READ[k]){ el.innerHTML = ""; return; }
  var r = SECTOR_READ[k];
  var name = (SECTORS.filter(function(s){return s.k===k;})[0]||{})[LANG] || k;
  el.innerHTML = '<div class="sread"><h3>'+name+'</h3><dl>'+
    '<dt>'+t.sGood+'</dt><dd>'+tx(r.good)+'</dd>'+
    '<dt>'+t.sExpect+'</dt><dd>'+tx(r.expect)+'</dd>'+
    '<dt>'+t.sLeads+'</dt><dd>'+tx(r.leads)+'</dd>'+
    '</dl></div>';
}

function renderEvidence(){
  var t = L();
  document.getElementById("e-h").textContent = t.eH;
  document.getElementById("e-p").textContent = t.eP;
  var lab = {causal:t.evCausal, survey:t.evSurvey, contested:t.evContested, gap:t.evGap};
  document.getElementById("evlist").innerHTML = EVIDENCE.map(function(e){
    return '<div class="ev">'+
      '<span class="evtag '+e.strength+'">'+lab[e.strength]+'</span>'+
      '<div class="evclaim">'+tx(e.claim)+'</div>'+
      '<div class="evsrc"><b>'+t.evSource+':</b> '+tx(e.source)+
        ' <a class="evlink" href="'+e.url+'" target="_blank" rel="noopener">'+t.evRead+'</a></div>'+
      (e.note ? '<div class="evnote">'+tx(e.note)+'</div>' : '')+
    '</div>';
  }).join("");
}

function render(){
  var t = L();
  document.getElementById("kicker").textContent = t.kicker;
  document.getElementById("t-title").textContent = t.title;
  document.getElementById("t-sub").textContent = t.sub;
  document.getElementById("k-h").textContent = t.keyH;
  document.getElementById("k-p").textContent = t.keyP;
  document.getElementById("t-ctlabel").textContent = t.ctLabel;
  document.getElementById("t-stlabel").textContent = t.stLabel;
  document.getElementById("t-lvlabel").textContent = t.lvLabel;
  document.getElementById("t-selabel").textContent = t.seLabel;

  renderMatcher();
  chips("ctchips", CTS, CT, "ct");
  chips("stchips", STATUSES, ST, "st");
  chips("lvchips", LEVELS, LV, "lv");
  chips("sechips", SECTORS, SE, "se");
  renderSectorRead();

  var inCountry = OPPS.filter(function(o){ return o.ct === CT; });
  var rows = OPPS.filter(matches);
  var order = {open:0, annual:1};
  rows.sort(function(a,b){ return (order[a.status]-order[b.status]) || a.org.en.localeCompare(b.org.en); });
  document.getElementById("count").textContent = t.count(rows.length, inCountry.length);

  document.getElementById("list").innerHTML = rows.length ? rows.map(function(o){
    var stat = o.status==="open" ? (LANG==="en"?"Open now":"مفتوح الآن")
                                 : (LANG==="en"?"Runs each year":"يُقام سنويًا");
    var paid = o.paid==="yes" ? '<span class="tag">'+t.paidYes+'</span>'
             : o.paid==="no"  ? '<span class="tag">'+t.paidNo+'</span>' : "";
    return '<div class="opp">'+
      '<div class="otop"><span class="oorg">'+tx(o.org)+'</span>'+
      '<span class="oprog">'+tx(o.prog)+'</span>'+
      '<span class="tag'+(o.status==="open"?" open":"")+'">'+stat+'</span>'+paid+'</div>'+
      '<dl class="orows">'+
        '<dt>'+t.dWhen+'</dt><dd>'+tx(o.apply)+'</dd>'+
        '<dt>'+t.dWho+'</dt><dd>'+tx(o.elig)+'</dd>'+
        '<dt>'+t.dLong+'</dt><dd>'+tx(o.duration)+'</dd>'+
        '<dt>'+t.dHow+'</dt><dd>'+tx(o.how)+'</dd>'+
      '</dl>'+
      applyBlock(o, t)+
      '<div class="ometa">'+t.checked(o.checked)+'</div>'+
    '</div>';
  }).join("") : '<div class="empty">'+t.none+'</div>';

  document.getElementById("s-h").textContent = t.subH;
  document.getElementById("s-p").textContent = t.subP;
  document.getElementById("s-btn").textContent = t.subB;
  renderEvidence();
  document.getElementById("mc-h").textContent = t.mcH;
  document.getElementById("mc-p").textContent = t.mcP;
  document.getElementById("mcgrid").innerHTML = MCLINKS.map(function(m){
    var c = m[LANG];
    return '<a class="mccard" href="'+m.href+'" target="_blank" rel="noopener"><b>'+c[0]+'</b><span>'+c[1]+'</span></a>';
  }).join("");
  document.getElementById("srcT").textContent = t.srcT;
  document.getElementById("srcS").textContent = t.srcS;
  document.getElementById("t-disc").textContent = t.disc;
  document.getElementById("t-foot").textContent = t.foot;
}

function applyBlock(o, t){
  var a = (typeof APPLY !== "undefined" && APPLY[o.id]) || {};
  var out = '<div class="applyrow">';
  if(a.direct){
    out += '<a class="btn apply" href="'+a.direct+'" target="_blank" rel="noopener">'+t.applyDirect+'</a>';
  }
  if(a.email){
    var extra = a.attach ? a.attach[LANG] : null;
    var href = "mailto:" + a.email +
      "?subject=" + encodeURIComponent(a.subject || (o.prog[LANG] + " " + (LANG==="en"?"application":"طلب تدريب"))) +
      "&body=" + encodeURIComponent(applyBody(o, LANG, extra));
    out += '<a class="btn apply mail" href="'+href+'">'+t.applyEmail+'</a>';
  }
  out += '<a class="olink" href="'+o.url+'" target="_blank" rel="noopener">'+t.more+'</a>';
  out += '</div>';
  if(!a.direct && !a.email){
    out += '<div class="needbox"><b>'+t.applyNeedT+'</b><p>'+t.applyNeed+'</p></div>';
  }
  out += '<a class="cvlink" href="cv.html">'+t.cvHelp+'</a>';
  return out;
}

function gc(path, title){
  if(window.goatcounter && window.goatcounter.count){
    try{ window.goatcounter.count({path:path, title:title, event:true}); }catch(e){}
  }
}

document.addEventListener("click", function(e){

  if(e.target.closest && e.target.closest(".evlink")) gc("io-evidence", "Evidence source");
});

   should follow the language too, not sit in English on an Arabic page. */

  ar: "كل فرصة تدريب في البحرين تحققنا منها، مع الرابط الذي يُقدَّم من خلاله فعلًا، والشهر الذي يفتح فيه، ولمن هي، وأدلة صادقة عن قيمة التدريب. مجانًا، بالعربية والإنجليزية، من د. صقر آل خليفة."
};
function syncHead(){

  var d = document.querySelector('meta[name="description"]');
  if(d) d.setAttribute("content", DOCDESC[LANG] || DOCDESC.en);
  var ol = document.querySelector('meta[property="og:locale"]');
  if(ol) ol.setAttribute("content", LANG === "ar" ? "ar_BH" : "en_US");

  document.documentElement.lang = LANG;

<script>
(function(){
  function sync(){
    var l = document.documentElement.lang === "ar" ? "ar" : "en";
    var n = document.querySelectorAll("[data-en]");
    for(var i=0;i<n.length;i++){ n[i].textContent = n[i].getAttribute("data-"+l); }
  }
  try{ new MutationObserver(sync).observe(document.documentElement,{attributes:true,attributeFilter:["lang"]}); }catch(e){}
  document.addEventListener("click", function(e){ if(e.target && e.target.id === "langToggle") setTimeout(sync, 0); }, true);
  sync();
})();
</script>
<script>
(function(){
  /* The visitor's language has to survive every click, including clicks that
     cross from one of these sites to another. They sit on different origins,
     so localStorage cannot carry the choice across; every internal link gets
     stamped with the current language instead. */
  var HOSTS = ["saqeralkhalifa.github.io", "internships.saqeralkhalifa.com",
               "saqeralkhalifa.com", "www.saqeralkhalifa.com"];

  function cur(){ return document.documentElement.lang === "ar" ? "ar" : "en"; }

  /* Never overwrite a lang that is already on the link. An explicit ?lang=ar
     link is itself a deliberate choice and outranks the running preference. */
  function stamp(a){
    try{
      var raw = a.getAttribute("href");
      if(!raw || raw.charAt(0) === "#") return;
      var u = new URL(raw, location.href);
      if(u.protocol !== "http:" && u.protocol !== "https:") return;
      if(HOSTS.indexOf(u.hostname) === -1) return;
      if(u.searchParams.has("lang")) return;
      u.searchParams.set("lang", cur());
      a.setAttribute("href", u.toString());
    }catch(e){}
  }
  function onAnchor(e){
    var t = e.target;
    var a = (t && t.closest) ? t.closest("a[href]") : null;
    if(a) stamp(a);
  }
  /* Capture phase, so the href is correct before the browser follows it.
     auxclick covers middle click, contextmenu covers "copy link address". */
  ["click", "auxclick", "contextmenu"].forEach(function(ev){
    document.addEventListener(ev, onAnchor, true);
  });

  var b = document.getElementById("langToggle");
  if(!b) return;
  var want = mcInitLang();
  if(want === "ar" && document.documentElement.lang !== "ar") b.click();
  if(want === "en" && document.documentElement.lang === "ar") b.click();
  mcSaveLang(want);
  document.addEventListener("click", function(e){
    if(e.target && e.target.id === "langToggle"){
      setTimeout(function(){
        mcSaveLang(document.documentElement.lang === "ar" ? "ar" : "en");
      }, 0);
    }
  }, true);
})();
</script>
